[project]
name = "keycloak-mcp"
# Real version = git tag vX.Y.Z (see GitHub Releases); never bumped here. Taiga #2870.
version = "0.0.0"
description = "MCP server for Keycloak administration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "TETRA" },
    { name = "Ido Yudha (upstream author)" },
]
dependencies = [
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "mcp[cli]>=1.30.0,<2",
    "uvicorn>=0.54.0",
    "starlette>=1.9.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: Run unit tests",
    "integration: Run integration tests (requires live Keycloak)",
]
addopts = "-v"

# Tag only: .github/workflows/release.yml tags the commit and creates the
# GitHub Release; nothing is committed to main.
[tool.semantic_release]
branch = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.1",
    "pre-commit>=4.7.0",
    "python-semantic-release>=10.7.0",
]
